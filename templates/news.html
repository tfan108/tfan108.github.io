{% extends 'base.html' %}
{% block content %}
<h1 class="page-title">News</h1>
{% for year, items in news|groupby('date.year')|reverse %}
<section class="section">
  <h2 class="section-title">{{ year }}</h2>
  <ul class="news-list">
    {% for n in items|sort(attribute='date', reverse=true) %}
    {% include 'partials/news_item.html' %}
    {% endfor %}
  </ul>
</section>
{% endfor %}
{% endblock %}
