#  新增一篇：复制下面的模板，粘贴到列表最上面（顺序无所谓，页面会自动排序），改字段即可。
#
#  - title: "Paper Title: With a Colon Needs Quotes"   # 必填（含冒号时要加英文双引号）
#    authors: [Zhang San, Li Si, Fan Tang]            # 必填，按署名顺序，英文逗号分隔
#    corresponding: [Fan Tang]                        # 通讯作者，可多个；名字须与 authors 里一致
#    equal: [Zhang San, Li Si]                        # 可选，共同一作（显示 *）
#    venue: CVPR                                      # 必填，venues.yml 里的名字或别名（等级在那里统一设置）
#    year: 2026                                       # 必填
#    note: Highlight                                  # 可选，小标签：Oral / Highlight / Best Paper ...
#    links:                                           # 可选，有哪个写哪个
#      pdf: https://...                               #   论文 PDF / 正式出版页（标题会链接到这里）
#      arxiv: https://arxiv.org/abs/2601.00000
#      code: https://github.com/owner/repo            #   GitHub 链接 → 自动显示 GitHub 图标和 star 数
#      project: https://...                           #   项目主页
#      video: https://...
#    image: /images/papers/xxx.jpg                    # 可选，缩略图（放 static/images/papers/，自动压缩）
#    bibtex: |                                        # 可选，粘贴 BibTeX；不写会根据以上信息自动生成
#      @inproceedings{...}
#
#  偷懒写法：粘贴了 bibtex 的话，title / authors / year 可以不写，会从 BibTeX 里自动读取。
#  Google Scholar 引用数按标题自动匹配，不用填；个别匹配不上时（构建日志会提示），
#  加一行 scholar: <论文在 Scholar 上的 id> 即可（id 为 Scholar 论文详情页网址中
#  citation_for_view= 后面、冒号之后的那一串）。
#  其他可选字段：hidden: true（暂时不显示）
# ============================================================================

