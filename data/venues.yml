# ============================================================================
#  会议 / 期刊表（只需维护一次）
# ----------------------------------------------------------------------------
#  papers.yml 里每篇论文的 venue 写这里的“键名”（冒号前面那部分）或 aliases 里任意一个，
#  大小写不敏感。遇到新会议/期刊，在这里加一条即可，之后所有论文都能用。
#
#  字段说明：
#    name     全称，显示在论文信息行（必填）
#    type     conference / journal / preprint / poster / workshop（必填）
#    rank     等级标签，如 CCF-A / CCF-B / CCF-C / SCI Q1，留空则不显示
#    aliases  别名，写论文时可以用这些名字代替键名（可选）
#
#  这里的先后顺序 = 同一年内论文的显示顺序（排在越上面越靠前），
#  同一 venue 内，你是通讯作者的论文排在前面。
#
#  CCF 等级按 CCF 推荐目录（2022 版）预填，请自行核对；不确定的留空了。
# ============================================================================

ACM TOG:
  name: ACM Transactions on Graphics
  type: journal
  rank: CCF-A
  aliases: [TOG]

